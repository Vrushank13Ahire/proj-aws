<script type="text/plain" data-title="Practical no 1: Simple Reflex Agent for Vacuum Cleaner World">
# Simple Reflex Agent for Vacuum Cleaner World
def vacuum_agent(location, status):
    if status == "Dirty":
        return "Suck"
    elif location == "A":
        return "Move Right"
    else:
        return "Move Left"

# User input
location = input("Enter current location (A/B): ")
status = input("Enter status (Clean/Dirty): ")

# Agent action
action = vacuum_agent(location, status)
print("Agent Action:", action)
</script>

<script type="text/plain" data-title="Practical no 2: Model-Based Agent (Grid Navigation)">
# Model-Based Agent - Grid Navigation (simple version)

grid = [
    [0, 0, 0, 0],
    [1, 1, 0, 1],
    [0, 0, 0, 0],
    [0, 1, 1, 0]
]

start = (0, 0)
goal = (3, 3)
visited = []              # agent's memory (internal model)

def is_valid(x, y):
    if x < 0 or x >= 4 or y < 0 or y >= 4:
        return False      # outside the grid
    if grid[x][y] == 1:
        return False      # obstacle
    if (x, y) in visited:
        return False      # already visited
    return True

current = start
path = [current]
visited.append(current)

while current != goal:
    x, y = current
    moves = [(x + 1, y), (x, y + 1), (x, y - 1), (x - 1, y)]   # Down, Right, Left, Up
    moved = False

    for nx, ny in moves:
        if is_valid(nx, ny):
            current = (nx, ny)
            visited.append(current)
            path.append(current)
            moved = True
            break

    if not moved:
        print("No valid path found.")
        break

if current == goal:
    print("Goal Reached!")
    print("Path:", path)
</script>

<script type="text/plain" data-title="Practical no 3: A* Search Algorithm">
import heapq

def a_star(graph, start, goal, heuristic):
    open_list = []                         # priority queue
    heapq.heappush(open_list, (0, start))
    g_cost = {start: 0}                    # cost from start to each node
    parent = {start: None}                 # to rebuild the path

    while open_list:
        _, current = heapq.heappop(open_list)   # lowest f-cost

        if current == goal:                # goal reached: rebuild path
            path = []
            while current is not None:
                path.append(current)
                current = parent[current]
            return path[::-1]              # reverse

        for neighbor, cost in graph[current]:
            new_cost = g_cost[current] + cost
            if neighbor not in g_cost or new_cost < g_cost[neighbor]:
                g_cost[neighbor] = new_cost
                f_cost = new_cost + heuristic[neighbor]   # f = g + h
                heapq.heappush(open_list, (f_cost, neighbor))
                parent[neighbor] = current
    return None                            # no path

graph = {
    'A': [('B', 1), ('C', 3)],
    'B': [('D', 3), ('E', 6)],
    'C': [('F', 2)],
    'D': [('G', 1)],
    'E': [('G', 2)],
    'F': [('G', 1)],
    'G': []
}

heuristic = {'A': 5, 'B': 4, 'C': 3, 'D': 1, 'E': 2, 'F': 1, 'G': 0}

path = a_star(graph, 'A', 'G', heuristic)
print("Shortest Path:", path)
</script>

<script type="text/plain" data-title="Practical no 4: Alpha-Beta Pruning">
import math

def alpha_beta(depth, node_index, maximizing_player, values, alpha, beta):
    # Leaf node
    if depth == 3:
        return values[node_index]

    if maximizing_player:
        best = -math.inf
        for i in range(2):
            value = alpha_beta(depth + 1, node_index * 2 + i,
                               False, values, alpha, beta)
            best = max(best, value)
            alpha = max(alpha, best)
            if beta <= alpha:       # prune
                break
        return best
    else:
        best = math.inf
        for i in range(2):
            value = alpha_beta(depth + 1, node_index * 2 + i,
                               True, values, alpha, beta)
            best = min(best, value)
            beta = min(beta, best)
            if beta <= alpha:       # prune
                break
        return best

values = [3, 5, 6, 9, 1, 2, 0, -1]
result = alpha_beta(0, 0, True, values, -math.inf, math.inf)
print("Optimal Value:", result)
</script>

<script type="text/plain" data-title="Practical no 5: BFS to Solve the 8-Puzzle">
from collections import deque

goal = (1, 2, 3,
        4, 5, 6,
        7, 8, 0)

moves = [(-1, 0), (1, 0), (0, -1), (0, 1)]   # up, down, left, right

def get_neighbors(state):
    neighbors = []
    zero = state.index(0)            # position of the blank
    x, y = divmod(zero, 3)           # row, column

    for dx, dy in moves:
        nx, ny = x + dx, y + dy
        if 0 <= nx < 3 and 0 <= ny < 3:          # inside the board
            new_pos = nx * 3 + ny
            new_state = list(state)
            new_state[zero], new_state[new_pos] = new_state[new_pos], new_state[zero]
            neighbors.append(tuple(new_state))
    return neighbors

def bfs(start):
    queue = deque([(start, [])])     # (state, path so far)
    visited = {start}

    while queue:
        state, path = queue.popleft()

        if state == goal:
            return path + [state]

        for neighbor in get_neighbors(state):
            if neighbor not in visited:
                visited.add(neighbor)
                queue.append((neighbor, path + [state]))
    return None

start = (1, 2, 3,
         4, 5, 6,
         7, 0, 8)

solution = bfs(start)

if solution:
    print("Solution found!")
    for step in solution:
        print(step)
else:
    print("No solution exists.")
</script>

<script type="text/plain" data-title="Practical no 6: 8-Queens using Backtracking (CSP)">
N = 8
queens = [-1] * N        # queens[row] = column of the queen in that row

def is_safe(row, col):
    for r in range(row):
        if queens[r] == col:                       # same column
            return False
        if abs(queens[r] - col) == abs(r - row):   # same diagonal
            return False
    return True

def solve(row):
    if row == N:             # all queens placed
        return True
    for col in range(N):
        if is_safe(row, col):
            queens[row] = col        # place queen
            if solve(row + 1):
                return True
            queens[row] = -1         # backtrack
    return False

def print_board():
    for r in range(N):
        print(" ".join("Q" if queens[r] == c else "." for c in range(N)))

if solve(0):
    print("Solution Found:\n")
    print_board()
else:
    print("No Solution Exists")
</script>

<script type="text/plain" data-title="Practical no 7: Rule-Based Chatbot">
def chatbot():
    print("ChatBot: Hello! I am a simple chatbot.")
    print("Type 'bye' to exit.\n")

    while True:
        user = input("You: ").lower().strip()

        if user == "hello" or user == "hi":
            print("ChatBot: Hello! How can I help you?")
        elif "how are you" in user:
            print("ChatBot: I'm doing well. Thank you for asking!")
        elif "your name" in user:
            print("ChatBot: I am a Rule-Based ChatBot.")
        elif "course" in user:
            print("ChatBot: This is an Artificial Intelligence laboratory.")
        elif "python" in user:
            print("ChatBot: Python is a popular programming language used in AI.")
        elif "thank" in user:
            print("ChatBot: You're welcome!")
        elif user == "bye" or user == "exit":
            print("ChatBot: Goodbye! Have a nice day.")
            break
        else:
            print("ChatBot: Sorry, I don't understand that. Please try another question.")

chatbot()
</script>

<script type="text/plain" data-title="Practical no 8: Intelligent Agent - Number Guessing (Binary Search)">
def intelligent_agent():
    print("Think of a number between 1 and 100.")
    print("Respond with 'higher', 'lower', or 'correct'.")

    low = 1
    high = 100
    attempts = 0

    while low <= high:
        guess = (low + high) // 2
        attempts += 1
        print(f"My guess is: {guess}")
        feedback = input("Your response: ").lower().strip()

        if feedback == "correct":
            print(f"I guessed your number in {attempts} attempts!")
            break
        elif feedback == "higher":
            low = guess + 1
        elif feedback == "lower":
            high = guess - 1
        else:
            print("Invalid input! Please enter higher, lower, or correct.")
            attempts -= 1        # invalid reply should not count as a guess

intelligent_agent()
</script>

<script>
(function(){
  var list = document.getElementById("list");
  var blocks = document.querySelectorAll('script[type="text/plain"]');
  blocks.forEach(function(b){
    var code = b.textContent.replace(/^\n/, "").replace(/\s+$/, "") + "\n";

    btn.addEventListener("click", function(){
      function done(t){ btn.textContent = t; setTimeout(function(){ btn.textContent = "Copy code"; }, 1500); }
      try {
        navigator.clipboard.writeText(code).then(function(){ done("Copied"); }, function(){ fallback(); });
      } catch (e) { fallback(); }
      function fallback(){
        try {
          var ta = document.createElement("textarea"); ta.value = code;
          document.body.appendChild(ta); ta.select(); document.execCommand("copy");
          document.body.removeChild(ta); done("Copied");
        } catch (e2) { done("Select and copy"); }
      }
    });
    var dots = document.createElement("div"); dots.className = "dots";
    for (var i = 0; i < 3; i++) dots.appendChild(document.createElement("span"));
    head.appendChild(btn); head.appendChild(h); head.appendChild(dots);
    var num = b.getAttribute("data-title").match(/no (\d+)/)[1];

    c.textContent = code; pre.appendChild(c);
    sec.appendChild(head); sec.appendChild(prompt); sec.appendChild(pre); sec.appendChild(endp);

  });
})();
