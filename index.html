
<h1> Vrushank </h1>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vrushank Ahire | DevOps &amp; Cloud Portfolio</title>
  <meta name="description" content="Portfolio of Vrushank Ahire: CI/CD pipelines, Docker, Jenkins and AWS.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F1F4F8;
      --panel: #FFFFFF;
      --ink: #14213D;
      --mute: #4B5A74;
      --line: #CBD5E3;
      --accent: #2F5BEA;
      --ok: #0E8F7E;
      --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
      --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: var(--body); line-height: 1.65; font-size: 1.05rem;
    }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    .wrap { max-width: 62rem; margin: 0 auto; padding: 0 1.5rem; }
 
    header.top { padding: 1.4rem 0; }
    header.top .wrap { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .brand { font-family: var(--display); font-weight: 700; text-decoration: none; color: var(--ink); }
    nav a { margin-left: 1.4rem; color: var(--mute); text-decoration: none; font-weight: 500; }
    nav a:hover { color: var(--accent); }
 
    .hero { padding: 4.5rem 0 5rem; }
    h1 {
      font-family: var(--display); font-weight: 700; margin: 0;
      font-size: clamp(2.8rem, 9vw, 6rem); line-height: 1; letter-spacing: -0.035em;
    }
    .lead { max-width: 36rem; margin: 1.6rem 0 0; font-size: 1.25rem; color: var(--mute); }
 
    /* The pipeline: one animation on load, ends on the live build number */
    .pipe { display: grid; grid-template-columns: repeat(6, 1fr); list-style: none; margin: 3.5rem 0 0; padding: 0; }
    .pipe li { position: relative; padding-top: 2rem; font-size: .92rem; font-weight: 500; color: var(--mute); }
    .pipe li small { display: block; font-weight: 400; font-size: .82rem; }
    .pipe li::before {
      content: ""; position: absolute; top: 0; left: 0; width: 16px; height: 16px; border-radius: 50%;
      background: var(--bg); border: 2px solid var(--line);
      animation: node .35s forwards; animation-delay: calc(var(--i) * .5s + .4s);
    }
    .pipe li:not(:last-child)::after {
      content: ""; position: absolute; top: 7px; left: 22px; right: 6px; height: 2px; background: var(--line);
      animation: link .35s forwards; animation-delay: calc(var(--i) * .5s + .6s);
    }
    .pipe li:last-child::before { animation-name: nodeok; }
    .pipe li:last-child { color: var(--ink); }
    @keyframes node   { to { background: var(--accent); border-color: var(--accent); } }
    @keyframes nodeok { to { background: var(--ok); border-color: var(--ok); box-shadow: 0 0 0 6px rgba(14,143,126,.18); } }
    @keyframes link   { to { background: var(--accent); } }
 
    section { padding: 3.5rem 0; border-top: 1px solid var(--line); }
    .row { display: grid; grid-template-columns: 11rem 1fr; gap: 1rem 3rem; }
    h2 { font-family: var(--display); font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
    p { margin: 0 0 1rem; max-width: 40rem; }
 
    .skills { margin: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.6rem 2rem; }
    .skills dt { font-weight: 500; margin-bottom: .2rem; }
    .skills dd { margin: 0; color: var(--mute); }
 
    .project { padding: 0 0 2rem; margin: 0 0 2rem; border-bottom: 1px solid var(--line); }
    .project:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
    .project h3 { font-family: var(--display); font-size: 1.3rem; margin: 0 0 .5rem; }
    .tags { list-style: none; display: flex; flex-wrap: wrap; gap: .5rem; padding: 0; margin: 1rem 0 0; }
    .tags li { font-size: .85rem; padding: .15rem .7rem; border: 1px solid var(--line); border-radius: 99px; background: var(--panel); color: var(--mute); }
 
    .contact-list { display: flex; flex-wrap: wrap; gap: .8rem 1.4rem; align-items: center; margin-top: 1.2rem; }
    button.copy {
      font: inherit; font-weight: 500; cursor: pointer; padding: .6rem 1.2rem; border-radius: 8px;
      border: 2px solid var(--accent); background: var(--accent); color: #fff;
    }
    button.copy:hover { background: #2349c4; border-color: #2349c4; }
 
    footer { padding: 2rem 0 3rem; border-top: 1px solid var(--line); color: var(--mute); font-size: .92rem; }
 
    @media (max-width: 720px) {
      .row { grid-template-columns: 1fr; }
      .skills { grid-template-columns: 1fr; }
      nav a { margin: 0 1rem 0 0; }
      .pipe { grid-template-columns: 1fr; gap: 1.1rem; }
      .pipe li { padding: 0 0 0 2rem; }
      .pipe li::before { top: .3rem; }
      .pipe li:not(:last-child)::after { top: 1.5rem; bottom: -1.5rem; left: 7px; right: auto; width: 2px; height: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pipe li::before, .pipe li::after { animation: none; }
      .pipe li::before { background: var(--accent); border-color: var(--accent); }
      .pipe li:last-child::before { background: var(--ok); border-color: var(--ok); }
      .pipe li:not(:last-child)::after { background: var(--accent); }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
